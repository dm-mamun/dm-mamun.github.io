<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<style>
:root{--bg:#fafbfd;--s:#fff;--tx:#0f1722;--mu:#5d6878;--ac:#2563eb;--ac2:#7c3aed;--bd:#e5e9f0;--sh:0 8px 30px rgba(15,23,34,.07)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0e14;--s:#141923;--tx:#eaeef5;--mu:#93a0b4;--ac:#6ea8ff;--ac2:#a78bfa;--bd:#232b38;--sh:0 8px 30px rgba(0,0,0,.4)}}
:root[data-theme=dark]{--bg:#0b0e14;--s:#141923;--tx:#eaeef5;--mu:#93a0b4;--ac:#6ea8ff;--ac2:#a78bfa;--bd:#232b38;--sh:0 8px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
.w{max-width:1040px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
nav .w{display:flex;align-items:center;gap:22px;height:60px}
nav b{margin-right:auto;font-size:17px}
nav a{text-decoration:none;color:var(--mu);font-size:14px}nav a:hover{color:var(--ac)}
#th{border:1px solid var(--bd);background:var(--s);color:var(--tx);border-radius:99px;width:34px;height:34px;cursor:pointer;font-size:15px}
@media(max-width:700px){nav a.l{display:none}}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:center;padding-top:80px;padding-bottom:50px}
.badge{display:inline-block;border:1px solid var(--bd);background:var(--s);color:var(--mu);font-size:13px;padding:4px 14px;border-radius:99px;margin-bottom:18px}
h1{font-size:clamp(34px,6vw,58px);line-height:1.08;margin:0 0 12px;letter-spacing:-.02em}
.g{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.t{font-size:19px;font-weight:600;margin:0 0 14px}
.bio{color:var(--mu);max-width:560px;margin:0}
.cta,.soc{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{padding:10px 20px;border-radius:10px;border:1px solid var(--bd);background:var(--s);text-decoration:none;font-weight:600;font-size:14px;transition:.2s}
.btn:hover{transform:translateY(-2px);border-color:var(--ac)}
.btn.p{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border:0}
.pill{padding:6px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--s);text-decoration:none;font-size:13px;color:var(--mu)}
.pill:hover{color:var(--ac);border-color:var(--ac)}
.hp{justify-self:center;position:relative}
.hp:before{content:"";position:absolute;inset:-10px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));filter:blur(22px);opacity:.35}
.hp img,.hp .ini{position:relative;width:min(300px,70vw);aspect-ratio:1;border-radius:50%;object-fit:cover;border:5px solid var(--s);box-shadow:var(--sh);display:grid;place-items:center}
.ini{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:72px;font-weight:700}
@media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:40px}.hp{order:-1}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;padding-bottom:20px}
.st{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:18px;text-align:center}
.st b{display:block;font-size:30px}.st span{color:var(--mu);font-size:13px}
section{padding-top:64px}
h2{font-size:28px;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--mu);margin:0 0 26px}
.card{background:var(--s);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh)}
.sk{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.sk .card{padding:18px}.sk h3{margin:0 0 10px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--bg);border:1px solid var(--bd);padding:2px 11px;border-radius:99px;font-size:13px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.pc{overflow:hidden;display:flex;flex-direction:column;transition:.25s}
.pc:hover{transform:translateY(-5px)}
.pc .im{aspect-ratio:16/9;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-size:40px;font-weight:700;overflow:hidden}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pb{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.pb h3{margin:0;font-size:18px}.d{color:var(--mu);font-size:13px}
.pb p{margin:0;color:var(--mu);font-size:14.5px;flex:1}
.pb .btn{align-self:flex-start;padding:7px 14px;margin-top:4px}
.tl{border-left:2px solid var(--bd);margin-left:6px}
.ti{position:relative;padding:0 0 26px 26px}
.ti:before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.ti h3{margin:0;font-size:17px}.ti .o{color:var(--ac);font-size:14px;font-weight:600}
.ti p{margin:6px 0 0;color:var(--mu);font-size:14.5px}
.ac{display:grid;gap:10px}
.ac .card{padding:14px 18px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;box-shadow:none}
.ct{text-align:center;padding:48px 24px;margin-top:10px}
.ct h2{font-size:32px}.ct .cta,.ct .soc{justify-content:center}
footer{text-align:center;color:var(--mu);font-size:13px;padding:40px 24px}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<nav><div class="w"><b id="nm"></b><a class="l" href="#skills">Skills</a><a class="l" href="#projects">Projects</a><a class="l" href="#experience">Experience</a><a class="l" href="#achievements">Achievements</a><a href="#contact">Contact</a><button id="th" aria-label="Toggle theme">◐</button></div></nav>
<main id="app"></main>
<footer id="ft"></footer>
<script type="module">
import { load } from "./data.js";
const e = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const u = s => { s = String(s || "").trim(); if (/^[\w-]+(\.[\w-]+)+\//.test(s)) s = "https://" + s; return /^(https?:\/\/|data:image\/)/i.test(s) || !/^[a-z]+:/i.test(s) ? e(s) : "#"; };
const SEED = [{ value: "12+", label: "National competitions" }, { value: "92.6%", label: "BCI model accuracy" }, { value: "7+", label: "Teams mentored" }, { value: "6th", label: "World rank, ARC 2026" }];
const d = await load(), p = d.profile || {}, stats = d.stats || SEED;
const list = k => (d[k] || []).filter(x => x);
document.title = (p.name || "Portfolio") + " – Portfolio";
document.getElementById("nm").textContent = p.name || "";
document.getElementById("ft").textContent = "© " + new Date().getFullYear() + " " + (p.name || "");
const ini = (p.name || "?").split(/\s+/).filter(w => /\w/.test(w) && !/\.$/.test(w)).slice(0, 2).map(w => w[0]).join("");
const soc = [["github", "GitHub"], ["linkedin", "LinkedIn"], ["facebook", "Facebook"], ["instagram", "Instagram"], ["youtube", "YouTube"], ["x", "X"]]
  .filter(([k]) => p[k]).map(([k, l]) => `<a class="pill" href="${u(p[k])}" target="_blank" rel="noopener">${l}</a>`).join("");
const sec = (id, t, s, b) => b ? `<section id="${id}" class="w"><h2 class="rv">${t}</h2><p class="sub rv">${s}</p>${b}</section>` : "";
document.getElementById("app").innerHTML = `
<header class="hero w">
 <div class="rv">${p.location ? `<span class="badge">${e(p.location)}</span>` : ""}
  <h1>Hi, I’m <span class="g">${e(p.name)}</span></h1><p class="t">${e(p.title)}</p><p class="bio">${e(p.bio)}</p>
  <div class="cta"><a class="btn p" href="#contact">Get in touch</a><a class="btn" href="#projects">View projects</a>${p.cv ? `<a class="btn" href="${u(p.cv)}" target="_blank" rel="noopener">Download CV</a>` : ""}</div>
  <div class="soc">${soc}</div></div>
 <div class="hp rv">${p.photo ? `<img src="${u(p.photo)}" alt="${e(p.name)}">` : `<div class="ini">${e(ini)}</div>`}</div>
</header>
${stats.length ? `<div class="stats w">${stats.map(s => `<div class="st rv"><b class="g">${e(s.value)}</b><span>${e(s.label)}</span></div>`).join("")}</div>` : ""}
${sec("skills", "Skills", "Tools and technologies I work with.", list("skills").length ? `<div class="sk">${list("skills").map(s => `<div class="card rv"><h3>${e(s.group)}</h3><div class="chips">${String(s.items || "").split(",").filter(x => x.trim()).map(x => `<span class="chip">${e(x.trim())}</span>`).join("")}</div></div>`).join("")}</div>` : "")}
${sec("projects", "Projects", "Things I’ve designed, built and researched.", list("projects").length ? `<div class="pg">${list("projects").map(x => `<article class="card pc rv"><div class="im">${x.image ? `<img loading="lazy" src="${u(x.image)}" alt="${e(x.title)}" onerror="this.remove()">` : e((x.title || "?")[0])}</div><div class="pb"><span class="d">${e(x.date)}</span><h3>${e(x.title)}</h3><p>${e(x.desc)}</p>${x.tags ? `<div class="chips">${String(x.tags).split(",").filter(t => t.trim()).map(t => `<span class="chip">${e(t.trim())}</span>`).join("")}</div>` : ""}${x.link ? `<a class="btn" href="${u(x.link)}" target="_blank" rel="noopener">View project</a>` : ""}</div></article>`).join("")}</div>` : "")}
${sec("experience", "Experience", "Where I’ve worked and trained.", list("experience").length ? `<div class="tl">${list("experience").map(x => `<div class="ti rv"><span class="d">${e(x.date)}</span><h3>${e(x.role)}</h3><div class="o">${e(x.org)}</div><p>${e(x.desc)}</p></div>`).join("")}</div>` : "")}
${sec("achievements", "Achievements & Activities", "Competitions, leadership and community work.", list("achievements").length ? `<div class="ac">${list("achievements").map(x => `<div class="card rv"><span>${e(x.text)}</span><span class="d">${e(x.date)}</span></div>`).join("")}</div>` : "")}
<section id="contact" class="w"><div class="card ct rv"><h2>Let’s work together</h2><p class="sub">Open to robotics, embedded systems and automation opportunities.</p>
 <div class="cta">${p.email ? `<a class="btn p" href="mailto:${e(p.email)}">${e(p.email)}</a>` : ""}</div><div class="soc">${soc}</div></div></section>`;
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(x => x.isIntersecting && (x.target.classList.add("in"), io.unobserve(x.target))), { threshold: .08 }) : null;
document.querySelectorAll(".rv").forEach(el => io ? io.observe(el) : el.classList.add("in"));
document.getElementById("th").onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("theme", r.dataset.theme) } catch (e) { }
};
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t } catch (e) { }
</script>
</body>
</html>
