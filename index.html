<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Md. Mamun Ahmed – Electrical & Electronic Engineer | Robotics & Embedded Systems</title>
<meta name="description" content="Portfolio of Md. Mamun Ahmed: robotics, embedded systems, PCB design, PLC automation and brain-computer interface research from Bangladesh.">
<link rel="canonical" href="https://dm-mamun.github.io/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232563eb'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-size='32' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3EM%3C/text%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Md. Mamun Ahmed">
<meta property="og:title" content="Md. Mamun Ahmed – Robotics & Embedded Systems Engineer">
<meta property="og:description" content="Robots, embedded systems, PCB design, PLC automation and BCI research. See my projects, research and media features.">
<meta property="og:url" content="https://dm-mamun.github.io/">
<meta property="og:image" content="https://dm-mamun.github.io/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Md. Mamun Ahmed – Robotics & Embedded Systems Engineer">
<meta name="twitter:image" content="https://dm-mamun.github.io/og.png">
<meta name="theme-color" content="#2563eb">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":"Md. Mamun Ahmed","jobTitle":"Electrical & Electronic Engineer","url":"https://dm-mamun.github.io/","alumniOf":"Green University of Bangladesh","knowsAbout":["Robotics","Embedded Systems","PCB Design","PLC Programming","Brain-Computer Interface"]}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav><div class="w"><b id="nm"></b><span class="nl" id="nl"></span><button id="mb" aria-label="Menu">☰</button><button id="th" aria-label="Toggle theme">◐</button></div></nav>
<main id="app"></main>
<footer id="ft"></footer>
<script type="module">
import { main, list, card, META, e, U, md, chips, SEED, send, ready, initTheme, reveal, extras } from "./lib.js";
initTheme(document.getElementById("th")); extras();
const d = await main(), p = d.profile || {};
const [projects, research, certificates, press, posts, gallery] = await Promise.all(["projects", "research", "certificates", "press", "posts", "gallery"].map(c => list(c, d)));
const arr = k => (d[k] || []).filter(Boolean);
const services = d.services ?? SEED.services, stats = d.stats ?? SEED.stats, edu = d.education ?? SEED.education;
document.title = (p.name || "Portfolio") + " – Portfolio";
document.getElementById("nm").textContent = p.name || "";
document.getElementById("ft").textContent = "© " + new Date().getFullYear() + " " + (p.name || "");

const ini = (p.name || "?").split(/\s+/).filter(w => /\w/.test(w) && !/\.$/.test(w)).slice(0, 2).map(w => w[0]).join("");
const soc = [["github", "GitHub"], ["linkedin", "LinkedIn"], ["facebook", "Facebook"], ["instagram", "Instagram"], ["youtube", "YouTube"], ["x", "X"]]
  .filter(([k]) => p[k]).map(([k, l]) => `<a class="pill" href="${U(p[k])}" target="_blank" rel="noopener">${l}</a>`).join("");

const S = [];
const add = (id, label, t, s, body) => { if (body) S.push([id, label, `<section id="${id}" class="w"><h2 class="rv">${t}</h2><p class="sub rv">${s}</p>${body}</section>`]); };
const col = (c, items, n) => items.length ? `<div class="pg">${items.slice(0, n).map(x => card(c, x)).join("")}</div>${items.length > n ? `<p class="more"><a class="btn" href="page.html?c=${c}">View all ${items.length} →</a></p>` : ""}` : "";
const tl = (a, f) => `<div class="tl">${a.map(f).join("")}</div>`;

add("about", "About", "About me", "A little more about who I am.", p.about ? `<div class="card rv" style="padding:24px"><div class="md">${md(p.about)}</div></div>` : "");
add("services", "Services", "What I do", "Areas where I can help.", services.length ? `<div class="sk">${services.map(s => `<div class="card sv rv"><h3>${e(s.title)}</h3><p>${e(s.desc)}</p></div>`).join("")}</div>` : "");
add("gallery", "Gallery", "Gallery", "Moments from competitions, workshops and the lab.", gallery.length ? `<div class="gal">${gallery.slice(0, 12).map(x => `<figure class="rv" data-s="${U(x.image)}" data-c="${e(x.title)}"><img loading="lazy" src="${U(x.image)}" alt="${e(x.title)}">${x.title ? `<figcaption>${e(x.title)}</figcaption>` : ""}</figure>`).join("")}</div>` : "");
add("skills", "Skills", "Skills", "Tools and technologies I work with.", arr("skills").length ? `<div class="sk">${arr("skills").map(s => `<div class="card rv"><h3>${e(s.group)}</h3>${chips(s.items)}</div>`).join("")}</div>` : "");
add("projects", "Projects", ...META.projects.map(x => x), col("projects", projects, 6));
add("research", "Research", ...META.research, col("research", research, 4));
add("experience", "Experience", "Experience & Education", "Where I’ve worked, trained and studied.",
  (arr("experience").length || edu.length) ? `<div class="two"><div><h3>Experience</h3>${tl(arr("experience"), x => `<div class="ti rv"><span class="d">${e(x.date)}</span><h3>${e(x.role)}</h3><div class="o">${e(x.org)}</div><p>${e(x.desc)}</p></div>`)}</div><div><h3>Education</h3>${tl(edu, x => `<div class="ti rv"><span class="d">${e(x.date)}</span><h3>${e(x.degree)}</h3><div class="o">${e(x.school)}</div><p>${e(x.detail)}</p></div>`)}</div></div>` : "");
add("certificates", "Certificates", ...META.certificates, col("certificates", certificates, 6));
add("press", "Media", ...META.press, col("press", press, 3));
add("posts", "Blog", ...META.posts, col("posts", posts, 3));
add("achievements", "Achievements", "Achievements & Activities", "Competitions, leadership and community work.", arr("achievements").length ? `<div class="ac">${arr("achievements").map(x => `<div class="card rv"><span>${e(x.text)}</span><span class="d">${e(x.date)}</span></div>`).join("")}</div>` : "");
add("testimonials", "Testimonials", "What people say", "Words from supervisors, teammates and collaborators.", arr("testimonials").length ? `<div class="tg">${arr("testimonials").map(x => `<div class="card tc rv"><p>“${e(x.text)}”</p><div class="who">${x.photo ? `<img src="${U(x.photo)}" alt="">` : `<div class="av">${e((x.name || "?")[0])}</div>`}<div><b>${e(x.name)}</b><small>${e(x.role)}</small></div></div></div>`).join("")}</div>` : "");

const info = [["Email", p.email, p.email && "mailto:" + p.email], ["Phone", p.phone, p.phone && "tel:" + String(p.phone).replace(/\s/g, "")], ["Address", p.address || p.location, ""]].filter(x => x[1]);
add("contact", "Contact", "Get in touch", "Have a project, a question or an opportunity? Send me a message.", `<div class="cg">
 <div class="rv">${info.map(([l, v, h]) => `<div class="card ic"><span>${l}</span>${h ? `<a href="${U(h)}">${e(v)}</a>` : `<b>${e(v)}</b>`}</div>`).join("")}<div class="soc">${soc}</div></div>
 <form id="cf" class="card cf rv"><h3>Send a message</h3>
  <input name="name" placeholder="Your name" required maxlength="100"><input name="email" type="email" placeholder="Your email" required maxlength="150">
  <textarea name="message" placeholder="How can I help?" required maxlength="1900"></textarea>
  <input name="website" class="hp2" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button class="btn p" type="submit">Send message</button><div id="cs"></div></form></div>`);

const ORDER = ["about", "services", "projects", "research", "experience", "certificates", "gallery", "press", "posts", "skills", "achievements", "testimonials", "contact"];
S.sort((a, b) => ORDER.indexOf(a[0]) - ORDER.indexOf(b[0]));
const hero = `<header class="hero w"><div class="rv">${p.location ? `<span class="badge">${e(p.location)}</span>` : ""}${p.availability ? `<span class="badge av"><i></i>${e(p.availability)}</span>` : ""}
  <h1>Hi, I’m <span class="g">${e(p.name)}</span></h1><p class="t">${e(p.title)}</p><p class="bio">${e(p.bio)}</p>
  <div class="cta"><a class="btn p" href="#contact">Get in touch</a>${projects.length ? `<a class="btn" href="#projects">View projects</a>` : ""}${p.cv ? `<a class="btn" href="${U(p.cv)}" target="_blank" rel="noopener">Download CV</a>` : ""}</div><div class="soc">${soc}</div></div>
  <div class="hp rv">${p.photo ? `<img src="${U(p.photo)}" alt="${e(p.name)}">` : `<div class="ini">${e(ini)}</div>`}</div></header>
${stats.length ? `<div class="stats w">${stats.map(s => `<div class="st rv"><b class="g">${e(s.value)}</b><span>${e(s.label)}</span></div>`).join("")}</div>` : ""}
${p.now ? `<div class="w"><div class="card now rv"><b>Currently</b>${e(p.now)}</div></div>` : ""}`;

document.getElementById("app").innerHTML = hero + S.map(s => s[2]).join("");
document.getElementById("nl").innerHTML = S.filter(s => ["projects", "research", "experience", "posts", "contact"].includes(s[0])).map(s => `<a href="#${s[0]}">${s[1]}</a>`).join("");

const cf = document.getElementById("cf"), cs = document.getElementById("cs");
cf.onsubmit = async ev => {
  ev.preventDefault(); const f = new FormData(cf); if (f.get("website")) return;
  const m = { name: f.get("name").trim(), email: f.get("email").trim(), message: f.get("message").trim() };
  if (!ready) { location.href = `mailto:${p.email}?subject=${encodeURIComponent("Message from " + m.name)}&body=${encodeURIComponent(m.message + "\n\n" + m.email)}`; return; }
  try { if (Date.now() - (+localStorage.getItem("ls") || 0) < 30000) { cs.textContent = "Please wait a moment before sending again."; return; } } catch { }
  const b = cf.querySelector("button"); b.disabled = true; cs.textContent = "Sending…";
  try { await send(m); cf.reset(); cs.textContent = "Thank you! Your message has been sent."; try { localStorage.setItem("ls", Date.now()); } catch { } }
  catch { cs.textContent = "Sorry, something went wrong. Please email me directly."; }
  b.disabled = false;
};
reveal();
const lb = document.createElement("div"); lb.id = "lb"; document.body.appendChild(lb);
lb.onclick = () => lb.classList.remove("on");
document.querySelectorAll(".gal figure").forEach(f => f.onclick = () => { lb.innerHTML = `<img src="${f.dataset.s}" alt=""><span>${e(f.dataset.c)}</span>`; lb.classList.add("on"); });
</script>
</body>
</html>
