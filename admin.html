<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--tx:#14181f;--mu:#5b6573;--ac:#2563eb;--bd:#d9dee7}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#e8ecf2;--mu:#98a2b3;--ac:#5aa9ff;--bd:#2a313c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
.w{max-width:820px;margin:0 auto;padding:24px}
.bar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;z-index:5}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
h2{margin:28px 0 12px;font-size:19px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:76px;resize:vertical}
button{padding:8px 14px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font:inherit}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button.x{color:#d33;float:right;padding:3px 10px;font-size:13px}
#msg{font-size:13px;color:var(--mu)}
#login{max-width:340px;margin:12vh auto}
.hide{display:none}
.im{display:flex;gap:12px;align-items:center}
.im img,.im .ph{width:90px;height:60px;border-radius:6px;object-fit:cover;background:var(--bd);flex:none}
.im>div{flex:1;display:grid;gap:6px}
.hint{font-size:12px;color:var(--mu);margin:0 0 12px}
</style>
</head>
<body>
<div id="login" class="card hide">
  <h2 style="margin-top:0">Admin login</h2>
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <p><button class="p" id="go">Sign in</button></p><div id="msg0" style="color:#d33;font-size:13px"></div>
</div>
<div id="ed" class="hide">
  <div class="bar"><b>Portfolio admin</b><span id="msg"></span>
    <span><button onclick="window.open('index.html')">View site</button> <button class="p" id="save">Save</button> <button id="out">Sign out</button></span></div>
  <div class="w"><p class="hint">Images you upload are shrunk automatically and saved inside your database (limit about 1 MB in total, shown at the top). For many or large images, put them in an <b>images</b> folder in your GitHub repository and paste the path, for example <b>images/rover.jpg</b>.</p><div id="form"></div></div>
</div>
<script type="module">
import { defaults, load, ready, fb } from "./data.js";
const $ = id => document.getElementById(id);
const IMG = (l, w) => [l, "img", w];
const schema = {
  stats: ["Highlight numbers", { value: "Number (e.g. 12+)", label: "Label" }],
  skills: ["Skills", { group: "Group", items: "Items (comma separated)" }],
  projects: ["Projects", { title: "Title", date: "Date", desc: ["Description", "area"], image: IMG("Project image", 800), tags: "Tags (comma separated)", link: "Project link (GitHub, demo, video…)" }],
  experience: ["Experience", { role: "Role", org: "Organization", date: "Date", desc: ["Description", "area"] }],
  achievements: ["Achievements", { text: "Achievement", date: "Date" }]
};
const pf = { name: "Name", title: "Headline", bio: ["Bio", "area"], photo: IMG("Your photo (square works best)", 480), email: "Email", location: "Location", cv: "CV link (PDF URL or file path)", github: "GitHub URL", linkedin: "LinkedIn URL", facebook: "Facebook URL", instagram: "Instagram URL", youtube: "YouTube URL", x: "X (Twitter) URL" };
const SEED = [{ value: "12+", label: "National competitions" }, { value: "92.6%", label: "BCI model accuracy" }, { value: "7+", label: "Teams mentored" }, { value: "6th", label: "World rank, ARC 2026" }];
let data, F;
const e = s => String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
const get = p => p.split(".").reduce((o, k) => o?.[k], data);
const set = (p, v) => { const k = p.split("."); let o = data; while (k.length > 1) o = o[k.shift()]; o[k[0]] = v; };
const field = (path, spec, v) => {
  if (!Array.isArray(spec)) spec = [spec, "text"];
  const [l, t, w] = spec; v = v ?? "";
  if (t === "area") return `<label>${l}</label><textarea data-p="${path}">${e(v)}</textarea>`;
  if (t === "img") return `<label>${l}</label><div class="im">${v ? `<img src="${e(v)}">` : `<div class="ph"></div>`}<div>${v.startsWith("data:") ? `<small>Uploaded image ✓</small>` : `<input data-p="${path}" value="${e(v)}" placeholder="Paste image URL, or upload below">`}<input type="file" accept="image/*" data-f="${path}" data-w="${w}">${v ? `<button data-rm="${path}">Remove image</button>` : ""}</div></div>`;
  return `<label>${l}</label><input data-p="${path}" value="${e(v)}">`;
};
function render() {
  let h = `<h2>Profile & social links</h2><div class="card">${Object.entries(pf).map(([k, l]) => field("profile." + k, l, data.profile[k])).join("")}</div>`;
  for (const [s, [title, fields]] of Object.entries(schema)) {
    h += `<h2>${title}</h2>`;
    data[s].forEach((it, i) => { h += `<div class="card"><button class="x" data-del="${s}.${i}">Delete</button>${Object.entries(fields).map(([k, l]) => field(`${s}.${i}.${k}`, l, it[k])).join("")}</div>`; });
    h += `<button data-add="${s}">+ Add ${title.replace(/s$/, "").toLowerCase()}</button>`;
  }
  $("form").innerHTML = h; size();
}
const size = () => { const kb = Math.round(JSON.stringify(data).length / 1024); $("msg").textContent = `Size: ${kb} KB / ~1000 KB` + (kb > 900 ? " ⚠ too big, use image URLs" : ""); };
const sync = () => document.querySelectorAll("[data-p]").forEach(el => set(el.dataset.p, el.value));
function shrink(file, w) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const r = Math.min(1, w / img.width), c = document.createElement("canvas"); c.width = img.width * r; c.height = img.height * r; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .72)); };
    img.onerror = rej; img.src = url;
  });
}
$("form").addEventListener("click", ev => {
  const t = ev.target; sync();
  if (t.dataset.add) { data[t.dataset.add].push(Object.fromEntries(Object.keys(schema[t.dataset.add][1]).map(k => [k, ""]))); render(); }
  if (t.dataset.rm) { set(t.dataset.rm, ""); render(); }
  if (t.dataset.del && confirm("Delete this item?")) { const [s, i] = t.dataset.del.split("."); data[s].splice(+i, 1); render(); }
});
$("form").addEventListener("change", async ev => {
  const t = ev.target; if (!t.dataset.f || !t.files[0]) return;
  sync(); try { set(t.dataset.f, await shrink(t.files[0], +t.dataset.w)); render(); } catch { $("msg").textContent = "Could not read that image."; }
});
$("save").onclick = async () => {
  sync(); $("msg").textContent = "Saving…";
  try { await F.f.setDoc(F.f.doc(F.db, "portfolio", "main"), data); $("msg").textContent = "Saved ✓"; }
  catch (err) { $("msg").textContent = "Error: " + err.message; }
};
function prep(d) {
  data = structuredClone(d); data.profile ||= {};
  data.stats ||= structuredClone(SEED);
  for (const s of Object.keys(schema)) data[s] ||= [];
}
if (!ready) {
  $("ed").classList.remove("hide"); prep(defaults); render();
  $("msg").textContent = "Firebase not configured: edits can't be saved";
} else {
  F = await fb();
  F.u.onAuthStateChanged(F.auth, async u => {
    if (u) { prep(await load()); $("login").classList.add("hide"); $("ed").classList.remove("hide"); render(); }
    else { $("ed").classList.add("hide"); $("login").classList.remove("hide"); }
  });
  $("go").onclick = () => F.u.signInWithEmailAndPassword(F.auth, $("em").value, $("pw").value).catch(() => $("msg0").textContent = "Wrong email or password.");
  $("out").onclick = () => F.u.signOut(F.auth);
}
</script>
</body>
</html>
