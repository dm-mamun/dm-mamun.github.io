<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav><div class="w"><b><a id="nm" href="index.html"></a></b><span class="nl"><a href="index.html">Home</a><a href="index.html#contact">Contact</a></span><button id="mb" aria-label="Menu">☰</button><button id="th" aria-label="Toggle theme">◐</button></div></nav>
<main id="app"></main>
<footer id="ft"></footer>
<script type="module">
import { main, list, getOne, card, detail, META, e, initTheme, reveal, extras } from "./lib.js";
initTheme(document.getElementById("th")); extras();
const q = new URLSearchParams(location.search), c = q.get("c"), id = q.get("id");
if (!META[c]) location.replace("index.html");
const d = await main(), app = document.getElementById("app");
document.getElementById("nm").textContent = d.profile?.name || "";
document.getElementById("ft").textContent = "© " + new Date().getFullYear() + " " + (d.profile?.name || "");

if (id) {
  const x = await getOne(c, id);
  if (x) { document.title = x.title + " – " + (d.profile?.name || ""); app.innerHTML = detail(c, x); }
  else app.innerHTML = `<div class="w ph1"><p>Item not found. <a href="page.html?c=${c}">Back to list</a></p></div>`;
} else {
  const items = await list(c, d);
  document.title = META[c][0] + " – " + (d.profile?.name || "");
  const tags = [...new Set(items.flatMap(x => String(x.tags || "").split(",").map(t => t.trim()).filter(Boolean)))].sort();
  app.innerHTML = `<div class="w ph1"><a class="back" href="index.html">← Home</a><h1>${META[c][0]}</h1><p class="sub">${META[c][1]}</p>
   ${tags.length ? `<div class="fl" id="fl"><button class="on" data-t="">All</button>${tags.map(t => `<button data-t="${e(t)}">${e(t)}</button>`).join("")}</div>` : ""}
   <div class="pg" id="pg"></div>${items.length ? "" : "<p>Nothing here yet.</p>"}</div>`;
  const draw = t => { document.getElementById("pg").innerHTML = items.filter(x => !t || String(x.tags || "").split(",").map(s => s.trim()).includes(t)).map(x => card(c, x)).join(""); reveal(); };
  draw("");
  const fl = document.getElementById("fl");
  if (fl) fl.onclick = ev => { const b = ev.target.closest("button"); if (!b) return; fl.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); draw(b.dataset.t); };
}
reveal();
</script>
</body>
</html>
